name: Build Windows Release

on:
  workflow_dispatch: # Permite executar manualmente
  push:
    tags:
      - 'v*' # Executa automaticamente quando criar uma tag v1.0.0

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Enable Windows build
        run: flutter config --enable-windows-desktop
      
      - name: Build Windows Release
        run: flutter build windows --release
      
      - name: Create ZIP
        run: |
          cd build\windows\x64\runner\Release
          Compress-Archive -Path * -DestinationPath sushigen-v${{ github.ref_name }}-windows.zip
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sushigen-windows
          path: build/windows/x64/runner/Release/sushigen-v${{ github.ref_name }}-windows.zip
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/windows/x64/runner/Release/sushigen-v${{ github.ref_name }}-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
